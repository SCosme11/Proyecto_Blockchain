services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_ledger_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ai_ledger
    ports:
      - "5432:5432"
    volumes:
      - ai_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_ledger_pgdata:
